<!DOCTYPE html>
<!-- 이 파일은 '게임 화면의 뼈대'예요. 화면이 두 개(고르기/입히기)로 나뉘어요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옷입히기 게임 (완성!)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👗 옷입히기 게임</h1>
    <p class="subtitle">5단계 · 캐릭터가 옷차림을 평가해줘요</p>
  </header>

  <!-- ============ 화면 ① 캐릭터 고르기 ============ -->
  <section id="screen-select">
    <h2 class="screen-title">누구를 꾸며줄까요?</h2>
    <!-- 이 안은 game.js가 캐릭터 카드로 채워줘요 -->
    <div id="character-list" class="character-list"></div>
  </section>

  <!-- ============ 화면 ② 옷 입히기 ============ -->
  <section id="screen-dressup" class="game hidden">

    <!-- 왼쪽: 무대 -->
    <section class="stage-area">
      <button id="back-button" class="back-button">← 캐릭터 다시 고르기</button>
      <div class="stage">
        <!-- 이 안(캐릭터 그림)은 game.js가 고른 캐릭터에 맞춰 채워줘요 -->
        <svg viewBox="0 0 300 400" class="character" id="character-svg"></svg>
      </div>
      <!-- 캐릭터 대사: 유저가 보는 '유일한 힌트' -->
      <div class="speech-box">
        <div class="speech-name" id="current-name"></div>
        <div class="speech-quote" id="current-quote"></div>
      </div>

      <!-- 완성 버튼: 언제든 누를 수 있어요 -->
      <button id="finish-button" class="finish-button">완성! 무대로 보내기</button>
      <p id="finish-message" class="finish-message"></p>
    </section>

    <!-- 오른쪽: 옷장 -->
    <section class="wardrobe">
      <h2>옷장</h2>
      <div id="wardrobe-list"></div>
    </section>

  </section>

  <!-- ============ 화면 ③ 런웨이 ============ -->
  <section id="screen-runway" class="hidden">
    <h2 class="screen-title"><span id="runway-name"></span>의 런웨이 무대 ✨</h2>

    <div class="runway-stage">
      <!-- 무대 조명 -->
      <div class="runway-lights"></div>
      <!-- 바닥 카펫 (원근감 있는 사다리꼴) -->
      <div class="runway-carpet"></div>

      <!-- 걷는 캐릭터: walker(앞으로 다가오기) 안에 bob(위아래 흔들림) -->
      <div class="walker" id="walker">
        <div class="walker-bob">
          <svg viewBox="0 0 300 400" class="runway-character" id="runway-svg"></svg>
        </div>
      </div>

      <!-- 걷기가 끝나면 뜨는 '두구두구' 자막 -->
      <div id="runway-suspense" class="runway-suspense hidden">🥁 두구두구…</div>
    </div>
  </section>

  <!-- ============ 확인 팝업 (런웨이 올라가기 전) ============ -->
  <div id="confirm-overlay" class="overlay hidden">
    <div class="confirm-card">
      <div class="confirm-emoji">💃</div>
      <div class="confirm-title">이대로 런웨이에 올라갈까요?</div>
      <p class="confirm-text">무대에 오르면 이 옷차림으로 평가를 받아요.</p>
      <div class="confirm-buttons">
        <button id="confirm-no" class="ghost-button">아직요</button>
        <button id="confirm-yes" class="finish-button">네, 올라갈래요!</button>
      </div>
    </div>
  </div>

  <!-- ============ 결과 카드 (평가 팝업) ============ -->
  <div id="result-overlay" class="overlay hidden">
    <div class="result-card">
      <div class="result-tag">심사 결과</div>
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-score">
        <span id="result-score-num">0</span><span class="result-score-unit">점</span>
      </div>
      <div class="result-verdict" id="result-verdict"></div>
      <p class="result-comment" id="result-comment"></p>
      <div class="result-buttons">
        <button id="result-again-button" class="ghost-button">다른 캐릭터</button>
        <button id="result-edit-button" class="finish-button">옷 다시 입히기</button>
      </div>
      <p class="result-note">※ 지금은 임시 평가예요. 나중에 진짜 AI로 바뀌어요.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
