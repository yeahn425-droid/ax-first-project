<!DOCTYPE html>
<!-- 이 파일은 '게임 화면의 뼈대'예요. 브라우저가 이 파일을 열어서 화면을 그려요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옷입히기 게임 (1단계)</title>
  <!-- 아래 한 줄이 'style.css'(꾸미기 파일)를 불러와요 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👗 옷입히기 게임</h1>
    <p class="subtitle">1단계 · 옷을 눌러서 갈아입혀 보세요</p>
  </header>

  <main class="game">

    <!-- 왼쪽: 캐릭터가 서 있는 무대 -->
    <section class="stage-area">
      <div class="stage">
        <!--
          아래 SVG가 '임시 캐릭터 그림'이에요.
          layer-* 라고 이름 붙은 빈 칸들이 '옷을 걸어두는 층'이에요.
          game.js가 여기에 옷 그림을 넣었다 뺐다 해요.
        -->
        <svg viewBox="0 0 300 400" class="character">
          <!-- 다리 -->
          <rect x="128" y="255" width="18" height="90" rx="9" fill="#f2c9a0"/>
          <rect x="154" y="255" width="18" height="90" rx="9" fill="#f2c9a0"/>
          <!-- 신발 층 (여기에 신발이 들어와요) -->
          <g id="layer-shoes"></g>

          <!-- 팔 -->
          <rect x="95" y="150" width="16" height="80" rx="8" fill="#f2c9a0"/>
          <rect x="189" y="150" width="16" height="80" rx="8" fill="#f2c9a0"/>
          <!-- 몸통(맨살) -->
          <path d="M110 150 Q150 138 190 150 L182 258 L118 258 Z" fill="#f7d7b5"/>
          <!-- 상의 층 (여기에 옷이 들어와요) -->
          <g id="layer-top"></g>

          <!-- 머리 -->
          <circle cx="150" cy="95" r="46" fill="#f7d7b5"/>
          <!-- 머리카락 -->
          <path d="M104 92 Q104 44 150 44 Q196 44 196 92 Q196 66 150 66 Q104 66 104 92 Z" fill="#5b3b2e"/>
          <!-- 눈, 미소 -->
          <circle cx="135" cy="95" r="4" fill="#3a2b25"/>
          <circle cx="165" cy="95" r="4" fill="#3a2b25"/>
          <path d="M138 112 Q150 122 162 112" stroke="#b56a5a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 모자 층 (여기에 모자가 들어와요) -->
          <g id="layer-hat"></g>
        </svg>
      </div>
      <p class="hint">지금은 임시 그림이에요. 나중에 진짜 캐릭터 그림으로 바꿀 거예요 🙂</p>
    </section>

    <!-- 오른쪽: 옷장 (누를 수 있는 옷 목록) -->
    <section class="wardrobe">
      <h2>옷장</h2>
      <!-- 이 안은 game.js가 자동으로 채워줘요 -->
      <div id="wardrobe-list"></div>
    </section>

  </main>

  <!-- 아래 한 줄이 'game.js'(게임의 두뇌)를 불러와요. 맨 마지막에 둬요. -->
  <script src="game.js"></script>
</body>
</html>
