<!DOCTYPE html>
<!-- 이 파일은 '게임 화면의 뼈대'예요. 화면이 두 개(고르기/입히기)로 나뉘어요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옷입히기 게임 (4단계)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👗 옷입히기 게임</h1>
    <p class="subtitle">4단계 · 완성하면 캐릭터가 런웨이를 걸어요</p>
  </header>

  <!-- ============ 화면 ① 캐릭터 고르기 ============ -->
  <section id="screen-select">
    <h2 class="screen-title">누구를 꾸며줄까요?</h2>
    <!-- 이 안은 game.js가 캐릭터 카드로 채워줘요 -->
    <div id="character-list" class="character-list"></div>
  </section>

  <!-- ============ 화면 ② 옷 입히기 ============ -->
  <section id="screen-dressup" class="game hidden">

    <!-- 왼쪽: 무대 -->
    <section class="stage-area">
      <button id="back-button" class="back-button">← 캐릭터 다시 고르기</button>
      <div class="stage">
        <!-- 이 안(캐릭터 그림)은 game.js가 고른 캐릭터에 맞춰 채워줘요 -->
        <svg viewBox="0 0 300 400" class="character" id="character-svg"></svg>
      </div>
      <!-- 캐릭터 대사: 유저가 보는 '유일한 힌트' -->
      <div class="speech-box">
        <div class="speech-name" id="current-name"></div>
        <div class="speech-quote" id="current-quote"></div>
      </div>

      <!-- 완성 버튼: 언제든 누를 수 있어요 -->
      <button id="finish-button" class="finish-button">완성! 무대로 보내기</button>
      <p id="finish-message" class="finish-message"></p>
    </section>

    <!-- 오른쪽: 옷장 -->
    <section class="wardrobe">
      <h2>옷장</h2>
      <div id="wardrobe-list"></div>
    </section>

  </section>

  <!-- ============ 화면 ③ 런웨이 ============ -->
  <section id="screen-runway" class="hidden">
    <h2 class="screen-title"><span id="runway-name"></span>의 런웨이 무대 ✨</h2>

    <div class="runway-stage">
      <!-- 무대 조명 -->
      <div class="runway-lights"></div>
      <!-- 바닥 카펫 (원근감 있는 사다리꼴) -->
      <div class="runway-carpet"></div>

      <!-- 걷는 캐릭터: walker(앞으로 다가오기) 안에 bob(위아래 흔들림) -->
      <div class="walker" id="walker">
        <div class="walker-bob">
          <svg viewBox="0 0 300 400" class="runway-character" id="runway-svg"></svg>
        </div>
      </div>
    </div>

    <!-- 걷기가 끝나면 나타나는 버튼들 -->
    <div class="runway-controls hidden" id="runway-controls">
      <button id="rewalk-button" class="ghost-button">🔁 다시 걷기</button>
      <button id="runway-edit-button" class="ghost-button">👗 옷 고치기</button>
      <button id="evaluate-button" class="finish-button">AI 평가 받기 →</button>
    </div>
    <p id="runway-message" class="finish-message"></p>
  </section>

  <script src="game.js"></script>
</body>
</html>
